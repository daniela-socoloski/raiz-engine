# Build Windows completo do cena-raiz: runtimes win32-x64 + instalador Squirrel.
#
# Disparo manual (workflow_dispatch). Sem "publish" marcado, o job so compila
# e anexa os artefatos (instalador + runtime pack) para teste manual. Com
# "publish", envia o runtime pack e o release para o canal proprio — exige os
# secrets CENA_RAIZ_CF_ACCOUNT_ID, CENA_RAIZ_CF_API_TOKEN, CENA_RAIZ_R2_BUCKET e
# CENA_RAIZ_UPDATE_BASE_URL no repositorio (mesmos nomes do signing.env local).
#
# Assinatura de codigo Windows ainda nao entra aqui: sem certificado o
# SmartScreen avisa "editor desconhecido" mas o instalador funciona.
#
# LAYOUT: este workflow nasceu no repositorio do aplicativo, onde o app ERA a
# raiz. No monorepo ele vive em apps/cena-raiz-desktop, entao os `run:` usam
# defaults.run.working-directory. Os caminhos lidos pelas ACTIONS (cache path,
# hashFiles, upload-artifact) NAO respeitam working-directory: continuam
# relativos a raiz do repositorio e por isso trazem o prefixo explicito.
name: windows-build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar runtime pack e release no canal proprio'
        type: boolean
        default: false

defaults:
  run:
    working-directory: apps/cena-raiz-desktop

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      # stage-uv verifica a attestation dos binarios com o gh CLI.
      GH_TOKEN: ${{ github.token }}
      CENA_RAIZ_CF_ACCOUNT_ID: ${{ secrets.CENA_RAIZ_CF_ACCOUNT_ID }}
      CENA_RAIZ_CF_API_TOKEN: ${{ secrets.CENA_RAIZ_CF_API_TOKEN }}
      CENA_RAIZ_R2_BUCKET: ${{ secrets.CENA_RAIZ_R2_BUCKET }}
      CENA_RAIZ_UPDATE_BASE_URL: ${{ secrets.CENA_RAIZ_UPDATE_BASE_URL }}
      # Assinatura Windows (Azure Trusted Signing). Sem estes secrets o build
      # sai sem assinatura, como antes.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      CENA_RAIZ_ATS_ENDPOINT: ${{ secrets.CENA_RAIZ_ATS_ENDPOINT }}
      CENA_RAIZ_ATS_ACCOUNT: ${{ secrets.CENA_RAIZ_ATS_ACCOUNT }}
      CENA_RAIZ_ATS_PROFILE: ${{ secrets.CENA_RAIZ_ATS_PROFILE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # O FFmpeg compartilhado do TorchCodec compila da fonte 7.1.5 (GPG
      # verificada) com o MSYS2 que ja vem no runner.
      - name: Toolchain MSYS2 (FFmpeg compartilhado + gpg)
        run: C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-toolchain make diffutils gnupg

      # Fontes do FFmpeg e caches do Python/uv sao os passos mais lentos;
      # a chave muda junto com o manifest dos runtimes.
      # v3: os caminhos mudaram de raiz para apps/cena-raiz-desktop na
      # reorganizacao do monorepo — reaproveitar um cache v2 restauraria os
      # arquivos no lugar antigo, que o build nao le mais.
      - name: Cache dos runtimes
        uses: actions/cache@v4
        with:
          # python-install fica de fora: contem junctions que o tar do cache
          # corrompe no Windows (os error 267); o stage recria do zero.
          path: |
            apps/cena-raiz-desktop/.runtime-cache
            !apps/cena-raiz-desktop/.runtime-cache/python-whisperx/*/python-install
          key: runtime-cache-win32-x64-v3-${{ hashFiles('apps/cena-raiz-desktop/resources/runtime-manifest.json', 'apps/cena-raiz-desktop/python/whisperx/uv.lock') }}

      - run: npm ci

      # Prepara o signtool do SDK + o dlib do Trusted Signing e exporta os
      # envs que o forge.config consome (windowsSign no packager e no
      # Squirrel). So roda quando os secrets do Azure existem.
      - name: Preparar assinatura (Azure Trusted Signing)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        shell: pwsh
        run: |
          nuget install Microsoft.Trusted.Signing.Client -x -OutputDirectory ats-client
          $dlib = (Get-ChildItem -Recurse ats-client -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1).FullName
          if (-not $dlib) { throw "Azure.CodeSigning.Dlib.dll nao encontrado" }
          $metadata = Join-Path $PWD "ats-metadata.json"
          @{ Endpoint = $env:CENA_RAIZ_ATS_ENDPOINT; CodeSigningAccountName = $env:CENA_RAIZ_ATS_ACCOUNT; CertificateProfileName = $env:CENA_RAIZ_ATS_PROFILE } | ConvertTo-Json | Set-Content $metadata -Encoding ascii
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          if (-not $signtool) { throw "signtool.exe do SDK nao encontrado" }
          "CENA_RAIZ_WIN_SIGNTOOL=$signtool" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "CENA_RAIZ_WIN_SIGN_PARAMS=/v /fd SHA256 /tr http://timestamp.acr.microsoft.com /td SHA256 /dlib `"$dlib`" /dmdf `"$metadata`"" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          Write-Host "Assinatura preparada com $signtool"

      # A cadeia "make" roda todos os stage:* na plataforma corrente
      # (win32-x64), empacota com o Vite e gera o instalador Squirrel.
      - name: Build completo (runtimes + instalador)
        run: npm run make

      - name: Runtime pack win32-x64
        run: npm run pack:runtimes

      - name: Anexar artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: cena-raiz-windows
          if-no-files-found: error
          path: |
            apps/cena-raiz-desktop/out/make/squirrel.windows/x64/*
            apps/cena-raiz-desktop/out/runtime-packs/*

      - name: Publicar runtime pack no canal proprio
        if: ${{ inputs.publish }}
        run: node scripts/publish-runtimes.mjs

      - name: Publicar release Windows no canal proprio
        if: ${{ inputs.publish }}
        run: node scripts/publish-update.mjs
