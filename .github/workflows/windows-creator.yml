name: Windows creator installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
        working-directory: apps/cena-raiz-desktop
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Raiz Engine
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/cena-raiz-desktop/package-lock.json

      - name: Toolchain MSYS2 para o FFmpeg compartilhado
        run: C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-toolchain make diffutils gnupg

      - name: Cache verificavel de runtimes
        uses: actions/cache@v4
        with:
          path: |
            apps/cena-raiz-desktop/.runtime-cache
            !apps/cena-raiz-desktop/.runtime-cache/python-whisperx/*/python-install
          key: creator-runtime-win32-x64-v3-${{ hashFiles('apps/cena-raiz-desktop/resources/runtime-manifest.json', 'apps/cena-raiz-desktop/python/whisperx/uv.lock') }}

      - name: Dependencias bloqueadas
        run: npm ci

      - name: Contratos, tipos e testes
        run: |
          npm run typecheck
          npm test

      - name: Construir instalador autonomo
        run: npm run make:creator

      - name: Abrir o aplicativo empacotado
        run: npm run smoke:creator

      - name: Anexar instalador, checksum e evidencia
        uses: actions/upload-artifact@v4
        with:
          name: raiz-engine-creator-win32-x64
          if-no-files-found: error
          retention-days: 14
          path: apps/cena-raiz-desktop/out/creator/win32-x64/*
